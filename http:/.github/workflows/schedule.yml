name: Run Bot Every 5 Hours

on:
  schedule:
    - cron: "0 /5   "
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - run: pip install python-telegram-bot
      - run: python bot.py
